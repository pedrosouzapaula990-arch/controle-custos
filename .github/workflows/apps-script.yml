# Publica o Apps Script automaticamente sempre que a pasta apps-script/ mudar.
# Mantém a mesma URL do Web App (atualiza a implantação existente).
name: Publicar Apps Script

on:
  push:
    branches: [main]
    paths: ["apps-script/**", ".github/workflows/apps-script.yml"]
  workflow_dispatch:

env:
  DEPLOYMENT_ID: AKfycby4poOb53Ar1FQ9IGSeeMScNtIkbFwJjhDqIWfgPqjZz-8alFa7NNWt9Exg9jnK-AGtCQ

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar clasp
        run: npm install -g @google/clasp@2.4.2
      - name: Credenciais
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then echo "Faltam os secrets CLASPRC_JSON e/ou SCRIPT_ID"; exit 1; fi
          echo "$CLASPRC_JSON" > ~/.clasprc.json
          echo "{\"scriptId\":\"$SCRIPT_ID\",\"rootDir\":\"apps-script\"}" > .clasp.json
      - name: Enviar código
        run: clasp push --force
      - name: Publicar nova versão (mesma URL)
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
